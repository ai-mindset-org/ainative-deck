<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html, body { margin:0; padding:0; width:1200px; height:630px; overflow:hidden; background:#161620; font-family:'IBM Plex Mono',monospace; }

/* Grid */
body::before { content:''; position:absolute; inset:0; background-image: linear-gradient(rgba(77,201,212,0.04) 1px,transparent 1px), linear-gradient(90deg,rgba(77,201,212,0.04) 1px,transparent 1px); background-size:60px 60px; }

/* Mesh */
.mesh { position:absolute; inset:0; }
.mesh .g1 { position:absolute; width:600px; height:600px; top:-100px; left:-100px; background:radial-gradient(circle,rgba(77,201,212,0.12) 0%,transparent 60%); }
.mesh .g2 { position:absolute; width:500px; height:500px; bottom:-50px; right:100px; background:radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 60%); }
.mesh .g3 { position:absolute; width:400px; height:400px; top:200px; right:-50px; background:radial-gradient(circle,rgba(56,217,169,0.06) 0%,transparent 60%); }

/* Top line */
.top-line { position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,transparent,#4dc9d4,transparent); }

/* Corner brackets */
.bracket-tl { position:absolute; top:24px; left:24px; width:40px; height:40px; border-left:2px solid rgba(77,201,212,0.2); border-top:2px solid rgba(77,201,212,0.2); }
.bracket-br { position:absolute; bottom:24px; right:24px; width:40px; height:40px; border-right:2px solid rgba(77,201,212,0.2); border-bottom:2px solid rgba(77,201,212,0.2); }

/* Content */
.content { position:relative; z-index:10; padding:60px 70px; height:100%; display:flex; flex-direction:column; justify-content:space-between; box-sizing:border-box; }
.label { font-size:13px; letter-spacing:4px; text-transform:uppercase; color:#4dc9d4; margin-bottom:16px; }
h1 { font-family:'Space Grotesk',sans-serif; font-size:56px; font-weight:700; color:#fff; line-height:1.15; margin:0 0 12px; max-width:620px; }
h1 .teal { color:#4dc9d4; }
.subtitle { font-size:18px; color:rgba(255,255,255,0.5); line-height:1.5; max-width:580px; }
.bottom { display:flex; justify-content:space-between; align-items:flex-end; }
.brand { display:flex; align-items:center; gap:10px; }
.brand img { height:32px; opacity:0.5; }
.brand span { font-size:12px; color:rgba(255,255,255,0.35); letter-spacing:2px; }
.date { font-size:13px; color:rgba(255,255,255,0.3); }

/* 6-layer mini stack on right */
.stack { position:absolute; right:70px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px; z-index:10; }
.stack-layer { width:180px; padding:10px 16px; border-radius:6px; font-size:11px; font-family:'IBM Plex Mono',monospace; color:rgba(255,255,255,0.7); border:1px solid rgba(77,201,212,0.15); }
.stack-layer.l1 { background:rgba(59,130,246,0.12); border-color:rgba(59,130,246,0.2); }
.stack-layer.l2 { background:rgba(77,201,212,0.12); border-color:rgba(77,201,212,0.2); }
.stack-layer.l3 { background:rgba(200,146,0,0.12); border-color:rgba(200,146,0,0.2); }
.stack-layer.l4 { background:rgba(77,201,212,0.08); border-color:rgba(77,201,212,0.15); }
.stack-layer.l5 { background:rgba(255,107,107,0.1); border-color:rgba(255,107,107,0.15); }
.stack-gov { position:absolute; right:-30px; top:0; bottom:0; width:24px; border:1px solid rgba(34,211,238,0.15); border-radius:4px; background:rgba(34,211,238,0.06); display:flex; align-items:center; justify-content:center; }
.stack-gov span { writing-mode:vertical-rl; font-size:9px; color:rgba(34,211,238,0.5); letter-spacing:2px; }
</style>
</head>
<body>
<div class="mesh"><div class="g1"></div><div class="g2"></div><div class="g3"></div></div>
<div class="top-line"></div>
<div class="bracket-tl"></div>
<div class="bracket-br"></div>

<div class="content">
  <div>
    <div class="label">// AI-Native Organizations Lab &middot; &nbsp;&#1053;&#1077;&#1076;&#1077;&#1083;&#1103; 2</div>
    <h1>&#1089;&#1080;&#1089;&#1090;&#1077;&#1084;&#1072; &#1087;&#1086;&#1074;&#1077;&#1088;&#1093;<br>&#1084;&#1086;&#1076;&#1077;&#1083;&#1080;<span class="teal">_</span></h1>
    <div class="subtitle">&#1080;&#1085;&#1090;&#1077;&#1088;&#1072;&#1082;&#1090;&#1080;&#1074;&#1085;&#1099;&#1081; workshop &middot; pipeline builder &middot; &#1087;&#1088;&#1086;&#1084;&#1087;&#1090;&#1099; &#1080;&#1079; &#1083;&#1077;&#1082;&#1094;&#1080;&#1080;</div>
  </div>
  <div class="bottom">
    <div class="brand">
      <img src="../../logo.png" alt="">
      <span>AI MINDSET &times; CYBOS</span>
    </div>
    <div class="date">31 &#1084;&#1072;&#1088;&#1090;&#1072; 2026</div>
  </div>
</div>

<div class="stack">
  <div class="stack-layer l5">People & Org</div>
  <div class="stack-layer l4">Skills & Workflows</div>
  <div class="stack-layer l3">Orchestration</div>
  <div class="stack-layer l2">Data & Context</div>
  <div class="stack-layer l1">Infrastructure</div>
  <div class="stack-gov"><span>GOVERNANCE</span></div>
</div>

</body></html>
