name: rebuild world graph manifest

on:
  pull_request:
    branches: [main]
    paths:
      - "ain3-starter-pack/world/**"
      - "ain3-starter-pack/data/world-manifest.json"
      - "tools/build-world-manifest.py"
      - "tools/test_world_manifest.py"
      - ".github/workflows/world-graph.yml"
  push:
    branches: [main]
    paths:
      - "ain3-starter-pack/world/**"
      - "ain3-starter-pack/data/world-manifest.json"
      - "tools/build-world-manifest.py"
      - "tools/test_world_manifest.py"
      - ".github/workflows/world-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test manifest generation
        run: python3 -m unittest discover -s tools -p test_world_manifest.py -v
      - name: Check committed manifest
        run: python3 tools/build-world-manifest.py --check
