var slides = editedSlides || JSON.parse(JSON.stringify(baseSlides));

function loadSlides() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    if (Array.isArray(parsed.slides)) return parsed.slides;
  } catch (e) {}
  return null;
}

function saveSlides() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ slides: slides, updatedAt: new Date().toISOString() })); } catch (e) {}
}

function renderDeck() {
  var deck = document.getElementById("deck");
  deck.innerHTML = slides.map(function(slide, i) {
    var cls = "slide" + (i === current ? " active" : "") + (slide.shape ? " " + slide.shape : "");
    var edit = mode === "edit";
    var bullets = (slide.bullets || []).map(function(b, bi) {
      return '<div class="bullet"' + inlineAttr("bullet", bi, edit) + '>' + esc(b) + '</div>';
    }).join("");
    var chips = (slide.chips || []).map(function(c, ci) {
      return '<span class="chip"' + inlineAttr("chip", ci, edit) + '>' + esc(c) + '</span>';
    }).join("");
    var links = (slide.links || []).map(function(link) {
      return '<a class="link-card" href="' + esc(link.url) + '" target="_blank" rel="noreferrer"><span>' + esc(link.label) + '</span><small>' + esc(link.kind || "source") + '</small></a>';
    }).join("");
    if (slide.shape === "cover") {
      return '<section class="' + cls + '"><div class="slide-inner"><div class="copy">' +
        '<div class="eyebrow"' + inlineAttr("eyebrow", null, edit) + '>' + esc(slide.eyebrow) + '</div>' +
        '<h1' + inlineAttr("title", null, edit) + '>' + titleWithAccent(slide.title) + '</h1>' +
        '<p class="body"' + inlineAttr("body", null, edit) + '>' + esc(slide.body) + '</p>' +
        '<div class="chips">' + chips + '</div>' + (links ? '<div class="link-cards">' + links + '</div>' : '') +
        '</div></div><aside class="speaker-note">' + esc(slide.notes || "") + '</aside><img class="slide-logo" src="../../logo.png" alt=""></section>';
    }
    return '<section class="' + cls + '"><div class="slide-inner"><div class="copy">' +
      '<div class="eyebrow"' + inlineAttr("eyebrow", null, edit) + '>' + esc(slide.eyebrow) + '</div>' +
      '<h2' + inlineAttr("title", null, edit) + '>' + esc(slide.title) + '</h2>' +
      '<p class="body"' + inlineAttr("body", null, edit) + '>' + esc(slide.body) + '</p>' +
      '<div class="bullets">' + bullets + '</div><div class="chips">' + chips + '</div>' +
      (links ? '<div class="link-cards">' + links + '</div>' : '') + '</div><div class="visual">' + visualFor(slide.visual, slide) + '</div></div>' +
      '<aside class="speaker-note">' + esc(slide.notes || "") + '</aside><img class="slide-logo" src="../../logo.png" alt=""></section>';
  }).join("");
  bindInline();
  renderDots();
  renderPanel();
  updateChrome();
  updateVox();
}

function titleWithAccent(title) {
  var parts = String(title || "").split(":");
  if (parts.length < 2) return esc(title);
  return esc(parts[0]) + '<span class="accent">' + esc(parts.slice(1).join(":").trim()) + '</span>';
}

function inlineAttr(field, index, edit) {
  if (!edit) return "";
  var attr = ' contenteditable="true" spellcheck="false" data-field="' + field + '"';
  if (index !== null && index !== undefined) attr += ' data-index="' + index + '"';
  return attr;
}

function bindInline() {
  document.querySelectorAll('[contenteditable="true"]').forEach(function(el) {
    el.addEventListener("input", function() {
      var slide = slides[current];
      var field = el.getAttribute("data-field");
      var idx = el.getAttribute("data-index");
      if (idx !== null && idx !== undefined) {
        var arr = field === "chip" ? "chips" : "bullets";
        slide[arr][parseInt(idx, 10)] = el.textContent.trim();
      } else {
        slide[field] = el.textContent.trim();
      }
      saveSlides();
      updateVox();
    });
  });
}

function renderDots() {
  var dots = document.getElementById("dots");
  dots.innerHTML = slides.map(function(_, i) {
    return '<button class="dot' + (i === current ? " active" : "") + '" data-go="' + i + '" aria-label="slide ' + (i + 1) + '"></button>';
  }).join("");
  dots.querySelectorAll(".dot").forEach(function(btn) {
    btn.onclick = function() { go(parseInt(btn.getAttribute("data-go"), 10)); };
  });
}

function renderPanel() {
  var panel = document.getElementById("panel");
  if (mode === "map") {
    panel.innerHTML = '<h3>Карта и тайминг</h3><div class="timeline-list">' +
      timelineBlocks.map(function(block) {
        var active = current + 1 >= block.start && current + 1 <= block.end ? " active" : "";
        return '<button class="timeline-item' + active + '" data-start="' + (block.start - 1) + '"><span class="timeline-time">' + esc(block.time) + '</span><span><span class="timeline-title">' + esc(block.title) + '</span><span class="timeline-desc">' + esc(block.desc) + '</span></span><span class="timeline-range">' + block.start + "-" + block.end + '</span></button>';
      }).join("") +
      slides.map(function(slide, idx) {
        return '<button class="timeline-item' + (idx === current ? " active" : "") + '" data-start="' + idx + '"><span class="timeline-time">' + String(idx + 1).padStart(2, "0") + '</span><span><span class="timeline-title">' + esc(slide.title) + '</span><span class="timeline-desc">' + esc(slide.eyebrow || "") + '</span></span><span class="timeline-range">slide</span></button>';
      }).join("") + '</div>';
    panel.querySelectorAll("[data-start]").forEach(function(btn) {
      btn.onclick = function() { go(parseInt(btn.getAttribute("data-start"), 10)); };
    });
  } else if (mode === "edit") {
    var s = slides[current];
    panel.innerHTML = '<h3>Правка слайда</h3><div class="edit-list">' +
      field("eyebrow", s.eyebrow || "") + field("title", s.title || "", true) + field("body", s.body || "", true) +
      field("bullets", (s.bullets || []).join("\\n"), true) + field("chips", (s.chips || []).join(", ")) +
      field("notes", s.notes || "", true) +
      '<button class="mini primary" id="saveEdit">сохранить</button><button class="mini" id="resetDeck">к оригиналу</button><button class="mini" id="exportJson">export json</button></div>';
    document.getElementById("saveEdit").onclick = saveEditPanel;
    document.getElementById("resetDeck").onclick = function() {
      if (!confirm("сбросить локальные правки этой деки?")) return;
      slides = JSON.parse(JSON.stringify(baseSlides));
      localStorage.removeItem(STORAGE_KEY);
      renderDeck();
    };
    document.getElementById("exportJson").onclick = exportJson;
  } else {
    panel.innerHTML = "";
  }
}

function field(name, value, textarea) {
  return '<div class="field"><label>' + esc(name) + '</label>' + (textarea
    ? '<textarea id="edit-' + esc(name) + '">' + esc(value) + '</textarea>'
    : '<input id="edit-' + esc(name) + '" value="' + esc(value) + '">') + '</div>';
}

function saveEditPanel() {
  var s = slides[current];
  ["eyebrow", "title", "body", "notes"].forEach(function(name) {
    var el = document.getElementById("edit-" + name);
    if (el) s[name] = el.value.trim();
  });
  var bullets = document.getElementById("edit-bullets");
  if (bullets) s.bullets = bullets.value.split("\\n").map(function(x) { return x.trim(); }).filter(Boolean);
  var chips = document.getElementById("edit-chips");
  if (chips) s.chips = chips.value.split(",").map(function(x) { return x.trim(); }).filter(Boolean);
  saveSlides();
  renderDeck();
}

function exportJson() {
  var blob = new Blob([JSON.stringify({ slides: slides }, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ain-ws02-context-observatory.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function updateChrome() {
  document.getElementById("counter").textContent = String(current + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
  document.getElementById("progress").style.width = ((current + 1) / slides.length * 100) + "%";
  document.getElementById("footerSection").textContent = sectionFor(current).title;
  document.getElementById("modePresent").classList.toggle("active", mode === "present");
  document.getElementById("modeEdit").classList.toggle("active", mode === "edit");
  document.getElementById("modeMap").classList.toggle("active", mode === "map");
}

function sectionFor(idx) {
  var n = idx + 1;
  return timelineBlocks.find(function(block) { return n >= block.start && n <= block.end; }) || timelineBlocks[0];
}

function updateVox() {
  var slide = slides[current];
  document.getElementById("voxMeta").textContent = "source: slide " + (current + 1) + "/" + slides.length + " · " + sectionFor(current).title + " · research yes";
  document.getElementById("voxText").textContent = voxFrame(slide);
}

function voxFrame(slide) {
  var key = slide.key || "";
  if (key.includes("cover")) return "LIVE ON: отдели вторую деку от dragon deck. Здесь не сила, а комната управления: где видны маршруты, evidence и следующий запуск.";
  if (key.includes("compass") || key.includes("participant")) return "LIVE ON: Compass объясняй как social context engine, не как матчер. Люди – context nodes, встреча – route, фидбек – evidence.";
  if (key.includes("graph")) return "LIVE ON: Graph Lab показывает связи и source provenance. Не список источников, а карта системы.";
  if (key.includes("playground") || key.includes("pack")) return "LIVE ON: context pack – минимальный переносимый артефакт. Его можно дать человеку, агенту или следующему слайду.";
  if (key.includes("team")) return "LIVE ON: Company OS рождается снизу: personal systems соединяются через workflow contracts и evidence.";
  if (key.includes("govern") || key.includes("harness")) return "LIVE ON: harness не направляет мысль, он ограничивает действие: owner, rights, policy, expiry, stop condition.";
  return "LIVE ON: держи формулу source -> signal -> context pack -> action -> evidence -> graph update. Всё остальное – детали этой петли.";
}

function setMode(next) {
  mode = next;
  document.body.classList.toggle("mode-map", mode === "map");
  document.body.classList.toggle("mode-edit", mode === "edit");
  renderDeck();
}

function go(idx) {
  current = Math.max(0, Math.min(slides.length - 1, idx));
  if (location.hash !== "#" + (current + 1)) history.replaceState(null, "", "#" + (current + 1));
  renderDeck();
}
function next() { go(current + 1); }
function prev() { go(current - 1); }

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function initialSlideFromHash() {
  var raw = String(location.hash || "").replace("#", "");
  var match = raw.match(/(?:slide-?|\/slide\/)?(\d+)/i);
  var n = match ? parseInt(match[1], 10) : 1;
  return Math.max(0, n - 1);
}

    '<path d="M640 220 C760 220 812 350 948 350" fill="none" stroke="#5cdacc" stroke-width="5"/>' +
    '<path d="M640 458 C760 458 812 350 948 350" fill="none" stroke="#e4b54b" stroke-width="5"/>' +
    node(948, 350, "action", "governed", "#56e39f")
  );
  if (type === "stack" || type === "engine") return svgWrap(
    gridLabel("modern stack") + stackLayer(180, 140, "interfaces", "MCP · GitHub · LMS · Obsidian", "#6db2ff") +
    stackLayer(250, 250, "context engine", "runtime · state · store", "#5cdacc") +
    stackLayer(320, 360, "graph memory", "relations · time · source", "#56e39f") +
    stackLayer(390, 470, "governed loop", "passport · policy · expiry", "#e4b54b") +
    stackLayer(460, 580, "evidence", "trace · eval · review", "#9c86ff")
  );
  if (type === "governance") return svgWrap(
    gridLabel("governed loop") + ringNode(600, 350, 260, "policy", "#e4b54b", -90) + ringNode(600, 350, 205, "rights", "#56e39f", -20) +
    ringNode(600, 350, 150, "tools", "#6db2ff", 58) + ringNode(600, 350, 95, "owner", "#ff6d61", 140) +
    node(600, 350, "agent passport", "scope + expiry", "#9c86ff")
  );
  if (type === "graph" || type === "memory") return svgWrap(
    gridLabel("graph memory") + node(246, 180, "people", "participants", "#e4b54b") + node(560, 138, "themes", "context", "#5cdacc") +
    node(882, 220, "pages", "lab surfaces", "#9c86ff") + node(360, 500, "artifacts", "files", "#6db2ff") +
    node(760, 514, "stack", "system layer", "#56e39f") +
    link(330, 210, 500, 160) + link(640, 160, 815, 242) + link(832, 268, 775, 484) + link(690, 508, 445, 508) + link(380, 468, 260, 230) + link(430, 480, 555, 178)
  );
  if (type === "compass" || type === "participants") return svgWrap(
    gridLabel("social context engine") + compassRose(600, 350) +
    node(210, 230, "profile", "role / stack", "#6db2ff") + node(460, 160, "request", "signal", "#5cdacc") +
    node(740, 160, "route", "pair / group", "#e4b54b") + node(970, 270, "feedback", "evidence", "#9c86ff") +
    node(600, 540, "cluster", "workgroup", "#56e39f")
  );
  if (type === "pack" || type === "factory") return svgWrap(
    gridLabel("artifact factory") + documentNode(210, 210, "context-pack.md", "#5cdacc") + documentNode(470, 170, "passport.md", "#e4b54b") +
    documentNode(730, 210, "guardrails.md", "#ff6d61") + documentNode(350, 470, "evidence.md", "#9c86ff") +
    documentNode(640, 470, "naming.md", "#6db2ff") + '<rect x="430" y="330" width="340" height="90" rx="18" fill="rgba(18,26,34,.92)" stroke="#56e39f"/><text x="505" y="386" fill="#f0f7f4" font-family="Space Grotesk" font-size="34">portable system</text>'
  );
  if (type === "teamstack") return svgWrap(
    gridLabel("company os from below") + stackPerson(170, 180, "person a") + stackPerson(450, 180, "person b") + stackPerson(730, 180, "person c") +
    '<rect x="210" y="520" width="780" height="102" rx="22" fill="rgba(18,26,34,.92)" stroke="#5cdacc"/><text x="350" y="584" fill="#f0f7f4" font-family="Space Grotesk" font-size="34">shared workflow contracts</text>' +
    route(285, 345, 360, 520, "#6db2ff") + route(565, 345, 600, 520, "#5cdacc") + route(845, 345, 820, 520, "#e4b54b")
  );
  if (type === "workcase" || type === "requirements" || type === "surface") return svgWrap(
    gridLabel("build path") + lane(130, 140, "choose one workflow", "low blast radius", "#6db2ff") +
    lane(190, 280, "compile context pack", "source · signal · owner", "#5cdacc") +
    lane(250, 420, "ship prototype", "1-3 weeks", "#56e39f") +
    lane(310, 560, "return evidence", "update graph", "#9c86ff")
  );
  if (type === "sources") return svgWrap(
    gridLabel("research -> requirements") + documentNode(160, 180, "LangChain", "#5cdacc") + documentNode(410, 140, "Anthropic", "#e4b54b") +
    documentNode(660, 180, "12-factor", "#6db2ff") + documentNode(280, 460, "Graphiti", "#56e39f") + documentNode(540, 500, "GraphRAG", "#9c86ff") + documentNode(800, 460, "OpenAI governance", "#ff6d61")
  );
  return svgWrap(gridLabel("context observatory") + node(600, 350, "context", "actionable", "#5cdacc"));
}

function svgWrap(inner) {
  return '<svg viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet">' + inner + '</svg>';
}
function gridLabel(text) {
  return '<text x="78" y="90" fill="rgba(240,247,244,.58)" font-family="IBM Plex Mono" font-size="18">' + esc(text) + '</text>';
}
function node(x, y, title, sub, color) {
  return '<g><rect x="' + (x - 94) + '" y="' + (y - 54) + '" width="188" height="108" rx="16" fill="rgba(18,26,34,.92)" stroke="' + color + '"/><text x="' + (x - 58) + '" y="' + (y - 8) + '" fill="#f0f7f4" font-family="Space Grotesk" font-size="24">' + esc(title) + '</text><text x="' + (x - 58) + '" y="' + (y + 24) + '" fill="rgba(240,247,244,.56)" font-family="IBM Plex Mono" font-size="14">' + esc(sub) + '</text></g>';
}
function box(x, y, text, color) {
  return '<rect x="' + x + '" y="' + y + '" width="170" height="82" rx="14" fill="rgba(18,26,34,.9)" stroke="' + color + '"/><text x="' + (x + 36) + '" y="' + (y + 50) + '" fill="#f0f7f4" font-family="Space Grotesk" font-size="26">' + esc(text) + '</text>';
}
function lane(x, y, title, sub, color) {
  return '<g><rect x="' + x + '" y="' + y + '" width="610" height="92" rx="16" fill="rgba(18,26,34,.88)" stroke="' + color + '"/><text x="' + (x + 28) + '" y="' + (y + 38) + '" fill="#f0f7f4" font-family="Space Grotesk" font-size="28">' + esc(title) + '</text><text x="' + (x + 28) + '" y="' + (y + 66) + '" fill="rgba(240,247,244,.58)" font-family="IBM Plex Mono" font-size="15">' + esc(sub) + '</text></g>';
}
function route(x1, y1, x2, y2, color) {
  return '<path d="M' + x1 + ' ' + y1 + ' C ' + ((x1 + x2) / 2) + ' ' + y1 + ', ' + ((x1 + x2) / 2) + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" fill="none" stroke="' + color + '" stroke-width="4" stroke-dasharray="12 14"/>';
}
function link(x1, y1, x2, y2) {
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="rgba(92,218,204,.45)" stroke-width="3"/>';
}
function orbit(cx, cy, r, color) {
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-dasharray="14 18" opacity=".66"/>';
}
function ringNode(cx, cy, r, label, color, angle) {
  var rad = angle * Math.PI / 180;
  var x = cx + Math.cos(rad) * r;
  var y = cy + Math.sin(rad) * r;
  return orbit(cx, cy, r, color) + node(x, y, label, "gate", color);
}
function stackLayer(x, y, title, sub, color) {
  return '<g><rect x="' + x + '" y="' + y + '" width="720" height="86" rx="18" fill="rgba(18,26,34,.88)" stroke="' + color + '"/><text x="' + (x + 32) + '" y="' + (y + 36) + '" fill="#f0f7f4" font-family="Space Grotesk" font-size="28">' + esc(title) + '</text><text x="' + (x + 32) + '" y="' + (y + 64) + '" fill="rgba(240,247,244,.58)" font-family="IBM Plex Mono" font-size="15">' + esc(sub) + '</text></g>';
}
function compassRose(cx, cy) {
  return '<g transform="translate(' + cx + ' ' + cy + ')"><circle r="154" fill="none" stroke="#5cdacc" stroke-width="3"/><circle r="88" fill="none" stroke="#e4b54b" stroke-width="2"/><path d="M0 -188 L44 -24 L0 -48 L-44 -24 Z" fill="rgba(228,181,75,.22)" stroke="#e4b54b" stroke-width="4"/><path d="M0 188 L44 24 L0 48 L-44 24 Z" fill="rgba(92,218,204,.18)" stroke="#5cdacc" stroke-width="4"/></g>';
}
function documentNode(x, y, title, color) {
  return '<g><path d="M' + x + ' ' + y + ' h170 v128 h-132 l-38 30 z" fill="rgba(18,26,34,.9)" stroke="' + color + '" stroke-width="2"/><line x1="' + (x + 30) + '" y1="' + (y + 42) + '" x2="' + (x + 140) + '" y2="' + (y + 42) + '" stroke="rgba(240,247,244,.22)"/><line x1="' + (x + 30) + '" y1="' + (y + 72) + '" x2="' + (x + 130) + '" y2="' + (y + 72) + '" stroke="rgba(240,247,244,.22)"/><text x="' + (x + 18) + '" y="' + (y + 112) + '" fill="#f0f7f4" font-family="IBM Plex Mono" font-size="15">' + esc(title) + '</text></g>';
}
function stackPerson(x, y, title) {
  return '<g><circle cx="' + (x + 100) + '" cy="' + y + '" r="46" fill="rgba(92,218,204,.12)" stroke="#5cdacc"/><text x="' + (x + 46) + '" y="' + (y + 90) + '" fill="#f0f7f4" font-family="Space Grotesk" font-size="24">' + esc(title) + '</text><rect x="' + x + '" y="' + (y + 120) + '" width="200" height="44" rx="10" fill="rgba(18,26,34,.9)" stroke="#6db2ff"/><rect x="' + x + '" y="' + (y + 176) + '" width="200" height="44" rx="10" fill="rgba(18,26,34,.9)" stroke="#5cdacc"/><rect x="' + x + '" y="' + (y + 232) + '" width="200" height="44" rx="10" fill="rgba(18,26,34,.9)" stroke="#e4b54b"/></g>';
}

document.getElementById("prevBtn").onclick = prev;
document.getElementById("nextBtn").onclick = next;
document.getElementById("modePresent").onclick = function() { setMode("present"); };
document.getElementById("modeEdit").onclick = function() { setMode(mode === "edit" ? "present" : "edit"); };
document.getElementById("modeMap").onclick = function() { setMode(mode === "map" ? "present" : "map"); };
document.getElementById("toggleVox").onclick = function() { document.body.classList.toggle("show-vox"); };
document.getElementById("toggleNotes").onclick = function() { document.body.classList.toggle("show-notes"); };

window.addEventListener("keydown", function(e) {
  var tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || document.activeElement.isContentEditable) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); prev(); }
  if (e.key.toLowerCase() === "e") setMode(mode === "edit" ? "present" : "edit");
  if (e.key.toLowerCase() === "m" || e.key.toLowerCase() === "t") setMode(mode === "map" ? "present" : "map");
  if (e.key.toLowerCase() === "v") document.body.classList.toggle("show-vox");
  if (e.key.toLowerCase() === "n") document.body.classList.toggle("show-notes");
  if (e.key === "Home") go(0);
  if (e.key === "End") go(slides.length - 1);
});

window.addEventListener("hashchange", function() {
  var target = initialSlideFromHash();
  if (target !== current) go(target);
});

renderDeck();
</script>
