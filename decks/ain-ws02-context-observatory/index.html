.operator-assistant::after {

.op-line { fill: none; stroke: #f0f7f4; stroke-width: 5.2; stroke-linecap: round; stroke-linejoin: round; }

var slides = editedSlides || JSON.parse(JSON.stringify(baseSlides));

function loadSlides() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    var parsed = JSON.parse(raw);
    if (Array.isArray(parsed.slides)) return parsed.slides;
  } catch (e) {}
  return null;
}

function saveSlides() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ slides: slides, updatedAt: new Date().toISOString() })); } catch (e) {}
}

    var cls = "slide" + (i === current ? " active" : "") + (slide.shape ? " " + slide.shape : "");
    var edit = mode === "edit";
    var bullets = (slide.bullets || []).map(function(b, bi) {
      return '<div class="bullet"' + inlineAttr("bullet", bi, edit) + '>' + esc(b) + '</div>';
    }).join("");

      return '<span class="chip"' + inlineAttr("chip", ci, edit) + '>' + esc(c) + '</span>';
    }).join("");
    var links = (slide.links || []).map(function(link) {
      return '<a class="link-card" href="' + esc(link.url) + '" target="_blank" rel="noreferrer"><span>' + esc(link.label) + '</span><small>' + esc(link.kind || "source") + '</small></a>';
    }).join("");
    if (slide.shape === "cover") {
      return '<section class="' + cls + '"><div class="slide-inner"><div class="copy">' +
        '<div class="eyebrow"' + inlineAttr("eyebrow", null, edit) + '>' + esc(slide.eyebrow) + '</div>' +
        '<h1' + inlineAttr("title", null, edit) + '>' + titleWithAccent(slide.title) + '</h1>' +
        '<p class="body"' + inlineAttr("body", null, edit) + '>' + esc(slide.body) + '</p>' +
        '<div class="chips">' + chips + '</div>' + (links ? '<div class="link-cards">' + links + '</div>' : '') +
        '</div></div><aside class="speaker-note">' + esc(slide.notes || "") + '</aside><img class="slide-logo" src="../../logo.png" alt=""></section>';
    }
    return '<section class="' + cls + '"><div class="slide-inner"><div class="copy">' +
      '<div class="eyebrow"' + inlineAttr("eyebrow", null, edit) + '>' + esc(slide.eyebrow) + '</div>' +
      '<h2' + inlineAttr("title", null, edit) + '>' + esc(slide.title) + '</h2>' +
      '<p class="body"' + inlineAttr("body", null, edit) + '>' + esc(slide.body) + '</p>' +
      '<div class="bullets">' + bullets + '</div><div class="chips">' + chips + '</div>' +
      (links ? '<div class="link-cards">' + links + '</div>' : '') + '</div><div class="visual">' + visualFor(slide.visual, slide) + '</div></div>' +
      '<aside class="speaker-note">' + esc(slide.notes || "") + '</aside><img class="slide-logo" src="../../logo.png" alt=""></section>';
  }).join("");
  bindInline();
  renderDots();
  renderPanel();
  updateChrome();
  updateVox();
}

function titleWithAccent(title) {
  var parts = String(title || "").split(":");
  if (parts.length < 2) return esc(title);
  return esc(parts[0]) + '<span class="accent">' + esc(parts.slice(1).join(":").trim()) + '</span>';
}

function inlineAttr(field, index, edit) {
  if (!edit) return "";
  var attr = ' contenteditable="true" spellcheck="false" data-field="' + field + '"';
  if (index !== null && index !== undefined) attr += ' data-index="' + index + '"';
  return attr;
}

function bindInline() {
  document.querySelectorAll('[contenteditable="true"]').forEach(function(el) {
    el.addEventListener("input", function() {
      var slide = slides[current];
      var field = el.getAttribute("data-field");
      var idx = el.getAttribute("data-index");
      if (idx !== null && idx !== undefined) {
        var arr = field === "chip" ? "chips" : "bullets";
        slide[arr][parseInt(idx, 10)] = el.textContent.trim();
      } else {
        slide[field] = el.textContent.trim();
      }
      saveSlides();
      updateVox();
    });
  });
}

function renderDots() {
  var dots = document.getElementById("dots");
  dots.innerHTML = slides.map(function(_, i) {
    return '<button class="dot' + (i === current ? " active" : "") + '" data-go="' + i + '" aria-label="slide ' + (i + 1) + '"></button>';
  }).join("");
  dots.querySelectorAll(".dot").forEach(function(btn) {
    btn.onclick = function() { go(parseInt(btn.getAttribute("data-go"), 10)); };
  });
}

function renderPanel() {
  var panel = document.getElementById("panel");
  if (mode === "map") {
    panel.innerHTML = '<h3>Карта и тайминг</h3><div class="timeline-list">' +
      timelineBlocks.map(function(block) {
        var active = current + 1 >= block.start && current + 1 <= block.end ? " active" : "";
        return '<button class="timeline-item' + active + '" data-start="' + (block.start - 1) + '"><span class="timeline-time">' + esc(block.time) + '</span><span><span class="timeline-title">' + esc(block.title) + '</span><span class="timeline-desc">' + esc(block.desc) + '</span></span><span class="timeline-range">' + block.start + "-" + block.end + '</span></button>';
      }).join("") +
      slides.map(function(slide, idx) {
        return '<button class="timeline-item' + (idx === current ? " active" : "") + '" data-start="' + idx + '"><span class="timeline-time">' + String(idx + 1).padStart(2, "0") + '</span><span><span class="timeline-title">' + esc(slide.title) + '</span><span class="timeline-desc">' + esc(slide.eyebrow || "") + '</span></span><span class="timeline-range">slide</span></button>';
      }).join("") + '</div>';
    panel.querySelectorAll("[data-start]").forEach(function(btn) {
      btn.onclick = function() { go(parseInt(btn.getAttribute("data-start"), 10)); };
    });
  } else if (mode === "edit") {
    var s = slides[current];
    panel.innerHTML = '<h3>Правка слайда</h3><div class="edit-list">' +
      field("eyebrow", s.eyebrow || "") + field("title", s.title || "", true) + field("body", s.body || "", true) +
      field("bullets", (s.bullets || []).join("\\n"), true) + field("chips", (s.chips || []).join(", ")) +
      field("notes", s.notes || "", true) +
      '<button class="mini primary" id="saveEdit">сохранить</button><button class="mini" id="resetDeck">к оригиналу</button><button class="mini" id="exportJson">export json</button></div>';
    document.getElementById("saveEdit").onclick = saveEditPanel;
    document.getElementById("resetDeck").onclick = function() {
      if (!confirm("сбросить локальные правки этой деки?")) return;
      slides = JSON.parse(JSON.stringify(baseSlides));
      localStorage.removeItem(STORAGE_KEY);
      renderDeck();
    };
    document.getElementById("exportJson").onclick = exportJson;
  } else {
    panel.innerHTML = "";
  }
}

function field(name, value, textarea) {
  return '<div class="field"><label>' + esc(name) + '</label>' + (textarea
    ? '<textarea id="edit-' + esc(name) + '">' + esc(value) + '</textarea>'
    : '<input id="edit-' + esc(name) + '" value="' + esc(value) + '">') + '</div>';
}

function saveEditPanel() {
  var s = slides[current];
  ["eyebrow", "title", "body", "notes"].forEach(function(name) {
    var el = document.getElementById("edit-" + name);
    if (el) s[name] = el.value.trim();
  });
  var bullets = document.getElementById("edit-bullets");
  if (bullets) s.bullets = bullets.value.split("\\n").map(function(x) { return x.trim(); }).filter(Boolean);
  var chips = document.getElementById("edit-chips");
  if (chips) s.chips = chips.value.split(",").map(function(x) { return x.trim(); }).filter(Boolean);
  saveSlides();
  renderDeck();
}

function exportJson() {
  var blob = new Blob([JSON.stringify({ slides: slides }, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ain-ws02-context-observatory.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function updateChrome() {
  document.getElementById("counter").textContent = String(current + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
  document.getElementById("progress").style.width = ((current + 1) / slides.length * 100) + "%";
  document.getElementById("footerSection").textContent = sectionFor(current).title;
  document.getElementById("modePresent").classList.toggle("active", mode === "present");
  document.getElementById("modeEdit").classList.toggle("active", mode === "edit");
  document.getElementById("modeMap").classList.toggle("active", mode === "map");
}

function sectionFor(idx) {
  var n = idx + 1;
  return timelineBlocks.find(function(block) { return n >= block.start && n <= block.end; }) || timelineBlocks[0];
}

function updateVox() {
  var slide = slides[current];
  document.getElementById("voxMeta").textContent = "source: slide " + (current + 1) + "/" + slides.length + " · " + sectionFor(current).title + " · research yes";

function setMode(next) {

function go(idx) {
  current = Math.max(0, Math.min(slides.length - 1, idx));
  if (location.hash !== "#" + (current + 1)) history.replaceState(null, "", "#" + (current + 1));
  renderDeck();
}
function next() { go(current + 1); }
function prev() { go(current - 1); }

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function initialSlideFromHash() {
  var raw = String(location.hash || "").replace("#", "");
  var match = raw.match(/(?:slide-?|\/slide\/)?(\d+)/i);
  var n = match ? parseInt(match[1], 10) : 1;
  return Math.max(0, n - 1);
}

document.getElementById("prevBtn").onclick = prev;
document.getElementById("nextBtn").onclick = next;
document.getElementById("modePresent").onclick = function() { setMode("present"); };
document.getElementById("modeEdit").onclick = function() { setMode(mode === "edit" ? "present" : "edit"); };
document.getElementById("modeMap").onclick = function() { setMode(mode === "map" ? "present" : "map"); };
document.getElementById("toggleVox").onclick = function() { document.body.classList.toggle("show-vox"); };
document.getElementById("toggleNotes").onclick = function() { document.body.classList.toggle("show-notes"); };
document.getElementById("operatorAssistant").onclick = function() { document.body.classList.toggle("show-vox"); };

window.addEventListener("keydown", function(e) {
  var tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input" || document.activeElement.isContentEditable) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft" || e.key === "Backspace") { e.preventDefault(); prev(); }
  if (e.key.toLowerCase() === "e") setMode(mode === "edit" ? "present" : "edit");
  if (e.key.toLowerCase() === "m" || e.key.toLowerCase() === "t") setMode(mode === "map" ? "present" : "map");
  if (e.key.toLowerCase() === "v") document.body.classList.toggle("show-vox");
  if (e.key.toLowerCase() === "n") document.body.classList.toggle("show-notes");
  if (e.key === "Home") go(0);
  if (e.key === "End") go(slides.length - 1);
});

window.addEventListener("hashchange", function() {
  var target = initialSlideFromHash();
  if (target !== current) go(target);
});

renderDeck();
