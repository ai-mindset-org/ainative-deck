<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Q&A · W1 лекция 1</title>
<meta property="og:title" content="Q&A · W1 лекция 1">
<meta property="og:description" content="Степан Гершуни — AI-трансформация">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!--
=== SUPABASE SETUP ===

Run this SQL in your Supabase SQL Editor:

create table qa_questions (
  id uuid default gen_random_uuid() primary key,
  session_id text not null default 'w1-lecture',
  phase text not null default 'during',
  question text not null,
  author text default 'анонимно',
  votes int default 0,
  voter_ids text[] default '{}',
  created_at timestamptz default now()
);

alter publication supabase_realtime add table qa_questions;

alter table qa_questions enable row level security;
create policy "Anyone can read" on qa_questions for select using (true);
create policy "Anyone can insert" on qa_questions for insert with check (true);
create policy "Anyone can update votes" on qa_questions for update using (true);
-->

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #161620;
  --bg-deep: #0a0a0f;
  --bg-card: #1c1c2e;
  --bg-terminal: #141419;
  --text: #e6edf3;
  --text-dim: rgba(255,255,255,0.5);
  --text-label: rgba(255,255,255,0.45);
  --teal: #4dc9d4;
  --teal-dim: rgba(77,201,212,0.15);
  --teal-glow: rgba(77,201,212,0.3);
  --green: #38d9a9;
  --blue: #3b82f6;
  --amber: #c89200;
  --red: #e5534b;
  --border: rgba(77,201,212,0.12);
  --border-hover: rgba(77,201,212,0.3);
  --grid-size: 60px;
  --font-heading: 'Space Grotesk', sans-serif;
  --font-body: 'IBM Plex Mono', monospace;
  --font-code: 'JetBrains Mono', monospace;
}

html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* === EFFECT LAYERS === */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(77,201,212,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(77,201,212,0.03) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
  pointer-events: none; z-index: 0;
}
.mesh {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(77,201,212,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(56,217,169,0.04) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}
.grain {
  position: fixed; inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
  opacity: 0.14;
  pointer-events: none; z-index: 9998;
}
.vignette {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
  pointer-events: none; z-index: 9997;
}
.top-line {
  position: fixed; top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--teal), transparent);
  z-index: 10000;
}

/* === LAYOUT === */
.container {
  position: relative; z-index: 10;
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

/* === CONFIG PANEL === */
.config-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.config-panel h2 {
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.config-panel p {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 16px;
}
.config-row {
  margin-bottom: 12px;
}
.config-row label {
  display: block;
  font-family: var(--font-code);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-label);
  margin-bottom: 6px;
}
.config-row input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font-code);
  font-size: 12px;
  outline: none;
  transition: border-color 0.3s ease;
}
.config-row input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(77,201,212,0.1);
}
.config-row input::placeholder {
  color: var(--text-label);
  opacity: 0.5;
}
.btn-config {
  width: 100%;
  padding: 12px;
  margin-top: 4px;
  background: linear-gradient(135deg, var(--teal), #3ba8b2);
  border: none;
  border-radius: 10px;
  color: var(--bg-deep);
  font-family: var(--font-heading);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}
.btn-config:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(77,201,212,0.3);
}
.config-error {
  margin-top: 10px;
  padding: 8px 12px;
  background: rgba(229,83,75,0.1);
  border: 1px solid rgba(229,83,75,0.2);
  border-radius: 8px;
  font-size: 12px;
  color: var(--red);
  display: none;
}

/* === OFFLINE BANNER === */
.offline-banner {
  display: none;
  background: rgba(200,146,0,0.1);
  border: 1px solid rgba(200,146,0,0.2);
  border-radius: 10px;
  padding: 10px 16px;
  margin-bottom: 20px;
  font-family: var(--font-code);
  font-size: 11px;
  color: var(--amber);
  text-align: center;
}

/* === CONNECTION STATUS === */
.connection-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-code);
  font-size: 11px;
  color: var(--text-label);
  opacity: 0.7;
}
.connection-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-label);
  transition: background 0.3s ease;
}
.connection-dot.connected {
  background: var(--green);
  box-shadow: 0 0 6px rgba(56,217,169,0.5);
}
.connection-dot.error {
  background: var(--red);
  box-shadow: 0 0 6px rgba(229,83,75,0.5);
}

/* === HEADER === */
.header {
  text-align: center;
  margin-bottom: 28px;
}
.header-label {
  font-family: var(--font-code);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--teal);
  opacity: 0.7;
  margin-bottom: 8px;
}
.header h1 {
  font-family: var(--font-heading);
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 6px;
}
.header-sub {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--text-dim);
}
.header-sub span {
  color: var(--teal);
  opacity: 0.8;
}

/* === PHASE TABS === */
.phase-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  background: var(--bg-deep);
  border-radius: 12px;
  padding: 4px;
  border: 1px solid var(--border);
}
.phase-tab {
  flex: 1;
  padding: 10px 12px;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
  border: none;
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.3s ease;
  background: transparent;
  color: var(--text-dim);
  position: relative;
}
.phase-tab:hover {
  color: var(--text);
  background: rgba(255,255,255,0.03);
}
.phase-tab.active {
  background: var(--teal-dim);
  color: var(--teal);
  box-shadow: 0 0 20px rgba(77,201,212,0.1);
}
.phase-tab .count {
  display: inline-block;
  min-width: 20px;
  height: 20px;
  line-height: 20px;
  padding: 0 6px;
  margin-left: 4px;
  border-radius: 10px;
  font-size: 11px;
  font-family: var(--font-code);
  background: rgba(255,255,255,0.06);
  color: var(--text-dim);
  vertical-align: middle;
}
.phase-tab.active .count {
  background: rgba(77,201,212,0.2);
  color: var(--teal);
}

/* === FORM === */
.form-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
  transition: border-color 0.3s ease;
}
.form-card:focus-within {
  border-color: var(--border-hover);
  box-shadow: 0 0 40px rgba(77,201,212,0.05);
}
.form-row {
  margin-bottom: 12px;
}
.form-label {
  display: block;
  font-family: var(--font-code);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-label);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-deep);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 14px;
  outline: none;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
.form-input::placeholder {
  color: var(--text-label);
  opacity: 0.7;
}
.form-input:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(77,201,212,0.1);
}
textarea.form-input {
  min-height: 80px;
  resize: vertical;
  line-height: 1.5;
}
.form-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.char-counter {
  font-size: 11px;
  color: var(--text-label);
  opacity: 0.6;
  font-family: var(--font-code);
}
.char-counter.warn { color: var(--amber); opacity: 1; }
.char-counter.over { color: var(--red); opacity: 1; }
.btn-submit {
  padding: 10px 28px;
  background: linear-gradient(135deg, var(--teal), #3ba8b2);
  border: none;
  border-radius: 10px;
  color: var(--bg-deep);
  font-family: var(--font-heading);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}
.btn-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 20px rgba(77,201,212,0.3);
}
.btn-submit:active {
  transform: translateY(0);
}
.btn-submit:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}
.btn-submit.sent {
  background: linear-gradient(135deg, var(--green), #2db590);
  pointer-events: none;
}

/* === QUESTIONS LIST === */
.questions-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.questions-title {
  font-family: var(--font-code);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-label);
}
.questions-sort {
  font-family: var(--font-code);
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0.5;
}

.questions-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.question-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  transition: all 0.3s ease;
  animation: fadeUp 0.4s ease both;
}
.question-card:hover {
  border-color: var(--border-hover);
}
.question-card.new-question {
  animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(-20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes voteFlash {
  0% { box-shadow: 0 0 0 0 rgba(77,201,212,0.3); }
  50% { box-shadow: 0 0 12px 2px rgba(77,201,212,0.15); }
  100% { box-shadow: 0 0 0 0 rgba(77,201,212,0); }
}
.question-card.vote-updated {
  animation: voteFlash 0.6s ease;
}

.question-text {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 12px;
  word-wrap: break-word;
  overflow-wrap: break-word;
}
.question-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.question-info {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.question-author {
  font-family: var(--font-code);
  font-size: 12px;
  color: var(--teal);
  opacity: 0.7;
}
.question-time {
  font-family: var(--font-code);
  font-size: 11px;
  color: var(--text-label);
  opacity: 0.5;
}
.question-phase-badge {
  font-family: var(--font-code);
  font-size: 10px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 6px;
  opacity: 0.6;
}
.phase-before {
  background: rgba(59,130,246,0.15);
  color: var(--blue);
}
.phase-during {
  background: var(--teal-dim);
  color: var(--teal);
}
.phase-after {
  background: rgba(56,217,169,0.15);
  color: var(--green);
}

.btn-upvote {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  font-family: var(--font-code);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s ease;
  flex-shrink: 0;
}
.btn-upvote:hover {
  border-color: var(--border-hover);
  color: var(--teal);
  background: var(--teal-dim);
}
.btn-upvote.voted {
  border-color: rgba(77,201,212,0.25);
  color: var(--teal);
  background: var(--teal-dim);
}
.btn-upvote .arrow {
  display: inline-block;
  transition: transform 0.25s ease;
}
.btn-upvote:hover .arrow,
.btn-upvote.voted .arrow {
  transform: translateY(-2px);
}

/* === EMPTY STATE === */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-dim);
}
.empty-icon {
  font-size: 36px;
  margin-bottom: 12px;
  opacity: 0.3;
}
.empty-text {
  font-family: var(--font-body);
  font-size: 14px;
  opacity: 0.5;
}

/* === FOOTER === */
.footer {
  margin-top: 48px;
  padding: 20px 0;
  text-align: center;
  border-top: 1px solid var(--border);
}
.footer-text {
  font-family: var(--font-code);
  font-size: 11px;
  color: var(--text-label);
  opacity: 0.4;
  margin-bottom: 6px;
}
.footer a {
  font-family: var(--font-code);
  font-size: 11px;
  color: var(--teal);
  opacity: 0.5;
  text-decoration: none;
  transition: opacity 0.3s;
}
.footer a:hover { opacity: 0.9; }

/* === TOAST === */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg-card);
  border: 1px solid var(--teal);
  border-radius: 12px;
  padding: 12px 24px;
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--teal);
  z-index: 10001;
  opacity: 0;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(77,201,212,0.1);
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* === SCROLL === */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(77,201,212,0.15); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(77,201,212,0.3); }

/* === HIDDEN === */
.hidden { display: none !important; }

/* === RESPONSIVE === */
@media (max-width: 480px) {
  .container { padding: 16px 12px 32px; }
  .header h1 { font-size: 22px; }
  .phase-tab { padding: 9px 8px; font-size: 11px; }
  .form-card { padding: 16px; }
  .question-card { padding: 14px; }
  .form-footer { flex-direction: column; align-items: stretch; }
  .btn-submit { text-align: center; }
}
</style>
</head>
<body>

<div class="top-line"></div>
<div class="mesh"></div>
<div class="grain"></div>
<div class="vignette"></div>

<div class="container">

  <!-- Config Panel (shown when Supabase not configured) -->
  <div class="config-panel hidden" id="config-panel">
    <h2>Supabase</h2>
    <p>вставьте URL и anon key вашего проекта</p>
    <div class="config-row">
      <label for="config-url">project url</label>
      <input type="text" id="config-url" placeholder="https://xxxxx.supabase.co">
    </div>
    <div class="config-row">
      <label for="config-key">anon key</label>
      <input type="text" id="config-key" placeholder="eyJhbGciOiJIUzI1NiIs...">
    </div>
    <button class="btn-config" onclick="saveConfig()">подключиться</button>
    <div class="config-error" id="config-error"></div>
  </div>

  <!-- Offline Banner -->
  <div class="offline-banner" id="offline-banner">
    offline mode &mdash; вопросы видны только вам
  </div>

  <!-- Header -->
  <div class="header">
    <div class="header-label">sprint s2 &middot; q&amp;a</div>
    <h1>Q&amp;A &middot; W1 лекция 1</h1>
    <div class="header-sub"><span>Степан Гершуни</span> &mdash; AI-трансформация</div>
  </div>

  <!-- Phase Tabs -->
  <div class="phase-tabs">
    <button class="phase-tab" data-phase="before" onclick="switchPhase('before')">
      до лекции <span class="count" id="count-before">0</span>
    </button>
    <button class="phase-tab active" data-phase="during" onclick="switchPhase('during')">
      во время <span class="count" id="count-during">0</span>
    </button>
    <button class="phase-tab" data-phase="after" onclick="switchPhase('after')">
      после лекции <span class="count" id="count-after">0</span>
    </button>
  </div>

  <!-- Form -->
  <div class="form-card">
    <div class="form-row">
      <label class="form-label" for="name-input">имя</label>
      <input class="form-input" id="name-input" type="text" placeholder="анонимно" autocomplete="off" maxlength="60">
    </div>
    <div class="form-row">
      <label class="form-label" for="question-input">вопрос</label>
      <textarea class="form-input" id="question-input" placeholder="что хотите спросить?" maxlength="500"></textarea>
    </div>
    <div class="form-footer">
      <span class="char-counter" id="char-count">0 / 500</span>
      <button class="btn-submit" id="btn-submit" onclick="submitQuestion()">отправить</button>
    </div>
  </div>

  <!-- Questions -->
  <div class="questions-header">
    <span class="questions-title">вопросы</span>
    <span class="connection-status" id="connection-status">
      <span class="connection-dot" id="connection-dot"></span>
      <span id="connection-label">offline</span>
    </span>
  </div>
  <div class="questions-list" id="questions-list"></div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-text">AI Mindset &times; CybOS &middot; AI-Native Sprint S2 &middot; 2026</div>
    <a href="https://learn.aimindset.org" target="_blank" rel="noopener">learn.aimindset.org</a>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
  'use strict';

  // ============================================================
  // CONFIG — fill in your Supabase credentials, or leave empty
  // to use the config panel / localStorage fallback
  // ============================================================
  const SUPABASE_URL = '';
  const SUPABASE_KEY = '';
  // ============================================================

  const SESSION_ID = 'w1-lecture';
  const LS_CONFIG_URL = 'qa-supabase-url';
  const LS_CONFIG_KEY = 'qa-supabase-key';
  const LS_QUESTIONS = 'qa-w1-questions';
  const LS_VOTER_ID = 'qa-w1-voter-id';

  // --- State ---
  let supabase = null;
  let isOnline = false;
  let currentPhase = 'during';
  let questions = [];
  let channel = null;

  // --- Voter ID ---
  function getVoterId() {
    let id = localStorage.getItem(LS_VOTER_ID);
    if (!id) {
      id = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem(LS_VOTER_ID, id);
    }
    return id;
  }
  const voterId = getVoterId();

  // --- Supabase Init ---
  function getSupabaseConfig() {
    const url = SUPABASE_URL || localStorage.getItem(LS_CONFIG_URL) || '';
    const key = SUPABASE_KEY || localStorage.getItem(LS_CONFIG_KEY) || '';
    return { url: url.trim(), key: key.trim() };
  }

  async function initSupabase() {
    const { url, key } = getSupabaseConfig();
    if (!url || !key) {
      showConfigPanel();
      return false;
    }

    try {
      supabase = window.supabase.createClient(url, key);
      // Test connection
      const { error } = await supabase.from('qa_questions').select('id', { count: 'exact', head: true });
      if (error) throw error;

      isOnline = true;
      setConnectionStatus('connected');
      hideConfigPanel();
      document.getElementById('offline-banner').style.display = 'none';
      await loadQuestions();
      subscribeRealtime();
      return true;
    } catch (err) {
      console.error('Supabase init failed:', err);
      isOnline = false;
      supabase = null;
      setConnectionStatus('error');
      // If hardcoded config failed, show error in config panel
      if (SUPABASE_URL && SUPABASE_KEY) {
        goOffline();
      } else {
        showConfigPanel();
        showConfigError('не удалось подключиться: ' + (err.message || err));
      }
      return false;
    }
  }

  function goOffline() {
    isOnline = false;
    setConnectionStatus('error');
    document.getElementById('offline-banner').style.display = 'block';
    hideConfigPanel();
    loadLocalQuestions();
    renderQuestions();
  }

  window.saveConfig = function() {
    const url = document.getElementById('config-url').value.trim();
    const key = document.getElementById('config-key').value.trim();
    if (!url || !key) {
      showConfigError('заполните оба поля');
      return;
    }
    localStorage.setItem(LS_CONFIG_URL, url);
    localStorage.setItem(LS_CONFIG_KEY, key);
    hideConfigError();
    initSupabase();
  };

  function showConfigPanel() {
    document.getElementById('config-panel').classList.remove('hidden');
    document.getElementById('offline-banner').style.display = 'none';
    // Pre-fill from localStorage
    const { url, key } = getSupabaseConfig();
    if (url) document.getElementById('config-url').value = url;
    if (key) document.getElementById('config-key').value = key;
  }

  function hideConfigPanel() {
    document.getElementById('config-panel').classList.add('hidden');
  }

  function showConfigError(msg) {
    const el = document.getElementById('config-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideConfigError() {
    document.getElementById('config-error').style.display = 'none';
  }

  function setConnectionStatus(state) {
    const dot = document.getElementById('connection-dot');
    const label = document.getElementById('connection-label');
    dot.className = 'connection-dot';
    if (state === 'connected') {
      dot.classList.add('connected');
      label.textContent = 'live';
    } else if (state === 'error') {
      dot.classList.add('error');
      label.textContent = 'offline';
    } else {
      label.textContent = 'offline';
    }
  }

  // --- Load Questions ---
  async function loadQuestions() {
    if (!isOnline) {
      loadLocalQuestions();
      return;
    }
    try {
      const { data, error } = await supabase
        .from('qa_questions')
        .select('*')
        .eq('session_id', SESSION_ID)
        .order('votes', { ascending: false })
        .order('created_at', { ascending: false });
      if (error) throw error;
      questions = data || [];
      renderQuestions();
    } catch (err) {
      console.error('Load questions failed:', err);
      loadLocalQuestions();
    }
  }

  function loadLocalQuestions() {
    try {
      questions = JSON.parse(localStorage.getItem(LS_QUESTIONS)) || [];
    } catch { questions = []; }
    renderQuestions();
  }

  function saveLocalQuestions() {
    localStorage.setItem(LS_QUESTIONS, JSON.stringify(questions));
  }

  // --- Realtime ---
  function subscribeRealtime() {
    if (!supabase || channel) return;

    channel = supabase
      .channel('qa-realtime')
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'qa_questions', filter: `session_id=eq.${SESSION_ID}` },
        (payload) => {
          const newQ = payload.new;
          // Avoid duplicates
          if (!questions.find(q => q.id === newQ.id)) {
            newQ._isNew = true;
            questions.push(newQ);
            renderQuestions();
          }
        }
      )
      .on(
        'postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'qa_questions', filter: `session_id=eq.${SESSION_ID}` },
        (payload) => {
          const updated = payload.new;
          const idx = questions.findIndex(q => q.id === updated.id);
          if (idx >= 0) {
            const wasVotes = questions[idx].votes;
            questions[idx] = { ...updated, _voteUpdated: updated.votes !== wasVotes };
            renderQuestions();
          }
        }
      )
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          setConnectionStatus('connected');
        } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
          setConnectionStatus('error');
        }
      });
  }

  // --- Phase ---
  window.switchPhase = function(phase) {
    currentPhase = phase;
    document.querySelectorAll('.phase-tab').forEach(tab => {
      tab.classList.toggle('active', tab.dataset.phase === phase);
    });
    renderQuestions();
  };

  // --- Submit ---
  window.submitQuestion = async function() {
    const nameInput = document.getElementById('name-input');
    const questionInput = document.getElementById('question-input');
    const btn = document.getElementById('btn-submit');
    const text = questionInput.value.trim();

    if (!text) {
      questionInput.focus();
      questionInput.style.borderColor = 'var(--amber)';
      setTimeout(() => { questionInput.style.borderColor = ''; }, 1500);
      return;
    }

    if (text.length > 500) return;

    const author = nameInput.value.trim() || 'анонимно';

    btn.disabled = true;
    btn.textContent = '...';

    if (isOnline && supabase) {
      try {
        const { error } = await supabase.from('qa_questions').insert({
          session_id: SESSION_ID,
          phase: currentPhase,
          question: text,
          author: author,
          votes: 0,
          voter_ids: [],
        });
        if (error) throw error;
      } catch (err) {
        console.error('Insert failed:', err);
        showToast('ошибка отправки');
        btn.disabled = false;
        btn.textContent = 'отправить';
        return;
      }
    } else {
      // Offline fallback
      const q = {
        id: 'local_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6),
        session_id: SESSION_ID,
        phase: currentPhase,
        question: text,
        author: author,
        votes: 0,
        voter_ids: [],
        created_at: new Date().toISOString(),
        _isNew: true,
      };
      questions.push(q);
      saveLocalQuestions();
      renderQuestions();
    }

    // Reset form
    questionInput.value = '';
    updateCharCount();
    btn.textContent = 'отправлено';
    btn.classList.add('sent');
    btn.disabled = false;
    setTimeout(() => {
      btn.textContent = 'отправить';
      btn.classList.remove('sent');
    }, 1800);
    showToast('вопрос отправлен');
  };

  // --- Upvote ---
  window.upvoteQuestion = async function(id) {
    const q = questions.find(q => q.id === id);
    if (!q) return;

    const voterIds = q.voter_ids || [];
    const hasVoted = voterIds.includes(voterId);

    let newVoterIds;
    let newVotes;

    if (hasVoted) {
      newVoterIds = voterIds.filter(v => v !== voterId);
      newVotes = Math.max(0, (q.votes || 0) - 1);
    } else {
      newVoterIds = [...voterIds, voterId];
      newVotes = (q.votes || 0) + 1;
    }

    if (isOnline && supabase) {
      // Optimistic update
      q.votes = newVotes;
      q.voter_ids = newVoterIds;
      renderQuestions();

      try {
        const { error } = await supabase
          .from('qa_questions')
          .update({ votes: newVotes, voter_ids: newVoterIds })
          .eq('id', id);
        if (error) throw error;
      } catch (err) {
        console.error('Vote failed:', err);
        // Revert
        if (hasVoted) {
          q.votes = (q.votes || 0) + 1;
          q.voter_ids = [...q.voter_ids, voterId];
        } else {
          q.votes = Math.max(0, (q.votes || 0) - 1);
          q.voter_ids = q.voter_ids.filter(v => v !== voterId);
        }
        renderQuestions();
        showToast('ошибка голосования');
      }
    } else {
      q.votes = newVotes;
      q.voter_ids = newVoterIds;
      saveLocalQuestions();
      renderQuestions();
    }
  };

  // --- Render ---
  function renderQuestions() {
    const container = document.getElementById('questions-list');

    // Update counts
    const counts = { before: 0, during: 0, after: 0 };
    questions.forEach(q => {
      if (counts[q.phase] !== undefined) counts[q.phase]++;
    });
    document.getElementById('count-before').textContent = counts.before;
    document.getElementById('count-during').textContent = counts.during;
    document.getElementById('count-after').textContent = counts.after;

    // Filter by phase
    const filtered = questions.filter(q => q.phase === currentPhase);

    // Sort by votes desc, then by created_at desc
    filtered.sort((a, b) => {
      const vDiff = (b.votes || 0) - (a.votes || 0);
      if (vDiff !== 0) return vDiff;
      const aTime = new Date(a.created_at).getTime();
      const bTime = new Date(b.created_at).getTime();
      return bTime - aTime;
    });

    if (filtered.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">?</div>
          <div class="empty-text">пока нет вопросов &mdash; будьте первым</div>
        </div>`;
      return;
    }

    container.innerHTML = filtered.map((q, i) => {
      const hasVoted = (q.voter_ids || []).includes(voterId);
      const time = formatRelativeTime(q.created_at);
      const phaseLabels = { before: 'до', during: 'во время', after: 'после' };
      const phaseLabel = phaseLabels[q.phase] || q.phase;
      const phaseClass = 'phase-' + q.phase;
      const delay = i * 0.04;
      const extraClass = q._isNew ? ' new-question' : (q._voteUpdated ? ' vote-updated' : '');
      return `
        <div class="question-card${extraClass}" style="animation-delay: ${delay}s" data-id="${q.id}">
          <div class="question-text">${escapeHtml(q.question)}</div>
          <div class="question-meta">
            <div class="question-info">
              <span class="question-author">${escapeHtml(q.author || 'анонимно')}</span>
              <span class="question-time">${time}</span>
              <span class="question-phase-badge ${phaseClass}">${phaseLabel}</span>
            </div>
            <button class="btn-upvote ${hasVoted ? 'voted' : ''}" onclick="upvoteQuestion('${q.id}')">
              <span class="arrow">&uarr;</span>
              <span>${q.votes || 0}</span>
            </button>
          </div>
        </div>`;
    }).join('');

    // Clear animation flags
    questions.forEach(q => { q._isNew = false; q._voteUpdated = false; });
  }

  // --- Relative Time (Russian) ---
  function formatRelativeTime(dateStr) {
    const now = Date.now();
    const then = new Date(dateStr).getTime();
    const diffSec = Math.floor((now - then) / 1000);

    if (diffSec < 10) return 'только что';
    if (diffSec < 60) return diffSec + ' сек назад';

    const diffMin = Math.floor(diffSec / 60);
    if (diffMin === 1) return '1 мин назад';
    if (diffMin < 5) return diffMin + ' мин назад';
    if (diffMin < 60) return diffMin + ' мин назад';

    const diffHour = Math.floor(diffMin / 60);
    if (diffHour === 1) return '1 час назад';
    if (diffHour < 5) return diffHour + ' часа назад';
    if (diffHour < 24) return diffHour + ' часов назад';

    const diffDay = Math.floor(diffHour / 24);
    if (diffDay === 1) return 'вчера';
    if (diffDay < 7) return diffDay + ' дн назад';

    // Fallback to date
    const d = new Date(dateStr);
    const pad = n => String(n).padStart(2, '0');
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // --- Helpers ---
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function updateCharCount() {
    const textarea = document.getElementById('question-input');
    const counter = document.getElementById('char-count');
    const len = textarea.value.length;
    counter.textContent = len + ' / 500';
    counter.className = 'char-counter';
    if (len > 450) counter.classList.add('warn');
    if (len >= 500) counter.classList.add('over');
  }

  // --- Update relative times periodically ---
  setInterval(() => {
    document.querySelectorAll('.question-time').forEach(el => {
      const card = el.closest('.question-card');
      if (!card) return;
      const id = card.dataset.id;
      const q = questions.find(q => q.id === id);
      if (q) el.textContent = formatRelativeTime(q.created_at);
    });
  }, 30000);

  // --- Init ---
  document.getElementById('question-input').addEventListener('input', updateCharCount);
  document.getElementById('question-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submitQuestion();
    }
  });

  // Restore saved name
  const savedName = localStorage.getItem('qa-w1-name');
  if (savedName) document.getElementById('name-input').value = savedName;
  document.getElementById('name-input').addEventListener('change', function() {
    localStorage.setItem('qa-w1-name', this.value);
  });

  // Boot
  if (typeof window.supabase !== 'undefined') {
    initSupabase().then(ok => {
      if (!ok) goOffline();
    });
  } else {
    // Supabase SDK not loaded — pure offline
    goOffline();
  }

})();
</script>
</body>
</html>
